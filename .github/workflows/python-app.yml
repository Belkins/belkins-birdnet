# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

# WHY THERE IS NO BRANCH FILTER HERE. Until 2026-08-01 this workflow was scoped
# to `push: [main, test_me]` / `pull_request: [main]`. The measured cost: branch
# `design/library-recompose` carried 25 commits — the ENTIRE cloud backup, the
# off-box dead-man's switch, the mic-flatline watchdog fix, Caddyfile.live and
# the 11.5x perf work — and scripts/repo-guards.sh (20 guards) plus ~200 tests
# never ran on a single one of them. web-ci.yml has no branch filter and was
# green throughout, so the ABSENCE of a python verdict looked like a pass.
#
# A guard you cannot run on the branch you are working on is not a guard. Do not
# re-add a branch scope: guard 12 in scripts/repo-guards.sh fails the build if
# a `branches:` key reappears under `push:`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      # v5, not v3: the `cache` input landed in setup-python v4 and is a no-op
      # (silently ignored, no warning that fails anything) on v3. Now that this
      # workflow runs on EVERY branch push, an uncached run re-downloads the
      # ~600 MB tensorflow wheel (requirements.txt:1) every time. Cache keys off
      # BOTH requirements files — the birdgen suite installs its own below, and
      # a key derived from only the root file would go stale without noticing.
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          services/birdgen/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # birdgen is a self-contained microservice with its own deps; its
        # FastAPI TestClient additionally needs httpx. Installed here so the
        # birdgen suite (run scoped to its dir below) can import + exercise app.
        pip install -r services/birdgen/requirements.txt httpx
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --statistics
    - name: Repo guards (species-notes JSON, real-art no-cache tripwire, suite enumeration)
      run: bash scripts/repo-guards.sh
    - name: Test with pytest
      run: |
        # This repo hosts five independent components, each shipping its OWN
        # tests/ package meant to run from its own directory. A single root
        # `pytest` collects five like-named `tests` packages (which collide:
        # "No module named 'tests.test_analysis'") and mixes incompatible deps,
        # so each suite is run scoped to its directory instead. Adding a new
        # component's tests/? Add a scoped line here AND to the ENUMERATED list
        # in scripts/repo-guards.sh (the guard above fails the build otherwise).
        python -m pytest tests/                       # stock BirdNET-Pi (root requirements)
        (cd avian/catalog && python -m pytest tests/) # christina catalog builder (stdlib)
        (cd avian/backup && python -m pytest tests/)  # off-box backup + restore (stdlib)
        (cd frame && python -m pytest tests/)         # e-ink frame watchdog (stdlib)
        (cd services/birdgen && python -m pytest tests/)  # birdgen microservice (own deps)
