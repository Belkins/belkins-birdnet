<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a090d" />
    <script>
      // Set the theme before first paint so a persisted Day theme doesn't flash dark.
      // ?theme=day|night overrides storage (kept in lockstep with theme.ts
      // storedTheme): the e-ink print path boots a fresh profile with no
      // storage and must not inherit the museum's evening dress.
      try {
        var _q = new URLSearchParams(location.search).get('theme');
        var _t = (_q === 'day' || _q === 'night') ? _q : localStorage.getItem('belkins-birdnet-theme');
        document.documentElement.setAttribute('data-theme', _t === 'day' ? 'day' : 'night');
        if (_t === 'day') document.querySelector('meta[name="theme-color"]').content = '#fcfaf4';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Belkins BirdNET — Living Gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
