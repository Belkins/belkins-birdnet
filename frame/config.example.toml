# Belkins BirdNET e-ink frame. install.sh writes this for you; edit to taste.
# config.toml is gitignored. Nothing here is secret unless your whole site is
# behind basic-auth (see the bottom). This file is the full reference.

# --- Where the collage comes from -------------------------------------------
# Default: mirror the BirdNET-Pi on your network. This Pi screenshots it.
base_url = "http://birdnet.local"
# Page the shooter screenshots, relative to base_url. Keep this off "/" —
# the root 302s to /collage/ (the React museum) and the shooter drives the
# legacy apt.js page. base_url stays bare because the API is appended to it.
shoot_path = "/index.html"
shoot = true

# Or shoot the React museum itself (the live Belkins wall runs this way):
# shoot_spa = true
# shoot_spa_path = "/collage/?surface=kiosk&theme=day&motion=off&budget=0.92&mintile=0.012&herocap=0.24"
# shoot_spa_settle_ms = 3500   # kiosk surface: outlive the exit pill's 3s fade
# The composition knobs (budget/mintile/herocap — the flock's share of the
# panel, the rarest bird's floor, the hero's ceiling — plus overlap, and
# air, which scales the safe-box insets so the flock may use the whole
# glass) ride IN the URL; the SPA validates them (web/src/profile.ts) and
# a bad value silently reverts to the page's own law. TWO traps: (a) a [views.<name>] table that carries
# its own shoot_spa_path REPLACES this string wholesale — restate the knobs
# there or that view shoots knob-less; (b) never put win= in this path —
# display.py appends the view's window itself, and the page reads the FIRST
# occurrence, so a baked-in win= would freeze every button to one window.

# Or fetch a ready-made PNG instead of rendering here (lighter, but needs
# something that serves a frame image, e.g. a public Cloudflare Worker):
# shoot = false
# image_url = "https://bird.example.com/frame.png?k=YOUR_FRAME_KEY"
# Or read a PNG a sibling process drops next to us:
# image = "~/.birdframe/frame.png"

hours = 24             # window shown on the frame

# --- Titles and look (used when this Pi renders, i.e. shoot = true) ----------
shoot_title = "Belkins BirdNET"
shoot_subtitle = "Heard Today"
# shoot_headline_px = 42
# shoot_eyebrow_px = 18
# shoot_lowercase = false
# shoot_mat = 0.04
# shoot_small_floor = 0.04
# shoot_count_exp = 0.65   # tile size vs call count; higher = the loudest birds dominate more
# shoot_zoom = 1.0         # THE size knob: renders at viewport/zoom, dsf*zoom — grows title
#                          # and birds together (1.4 live on the 13.3"). The packer sizes its
#                          # cluster from the viewport, so collage_vh alone cannot do this.
# shoot_collage_vh = 52    # the collage band's share of the page height
# shoot_cluster_xbias = 1.0  # ellipse spread; >1 = wider cluster
# shoot_cluster_ybias = 1.2
# shoot_cluster_pad = 1
# shoot_budget_frac = 1.0    # override the page's packing budget (it caps the flock at
#                            # ~a third of the panel area); 1.0 = full-bleed. Verify tile
#                            # placement per view when raising — unplaceable tiles hide
#                            # SILENTLY at x=-99999. Per-view overrides via [views.<name>].
# shoot_min_tile_frac = 0.022  # floor under the rarest bird, as area fraction

# --- Panel ------------------------------------------------------------------
rotate = 90            # 90 or 270 if the frame hangs the other way up
saturation = 0.6       # Inky colour saturation, 0 to 1
mat = 0.0              # extra shrink of the content inside the A5 opening (0 = none)
# mat_window = true    # false = NO A5 mat composition: the shot fills the glass
#                      # edge to edge. Use false on a bare/unframed panel; true
#                      # once the physical frame's passe-partout covers the rim.
# panel = "el133uf1"   # force the 13.3" driver if auto-detect ever fails

# --- Refresh cadence --------------------------------------------------------
# The panel refreshes only when the species set or a count bracket changes,
# plus a daily heal, and never more often than min_refresh_minutes. Quiet
# hours are off so nocturnal detections still show; set quiet_start/quiet_end
# to a window to mute overnight.
quiet_start = 0        # 0/0 = always refresh on change; e.g. 22 and 6 mutes 22:00-06:00
quiet_end = 0
heal_hours = 24        # force a refresh at least this often
min_refresh_minutes = 20  # never flash the panel more often than this (a full refresh is ~35s); 0 disables

# --- Buttons (the Impression's four side switches) ---------------------------
# birdframe-buttons.service turns them into windows: A Real time (1h), B Today
# (24h), C This Week (7d), D All Time. Re-pressing the showing view repaints
# it. A pressed view holds for view_ttl_hours, then the wall reverts to this
# config on its own. Define [views.<name>] tables to override any key per
# view — same names win over the built-ins per key:
# [views.week]
# hours = 72                      # a 3-day week, if that is your rhythm
# shoot_subtitle = "Heard This Week"
view_ttl_hours = 4
# view_file = "~/.birdframe/view.json"

# --- Paths ------------------------------------------------------------------
state = "~/.birdframe/state.json"
cache = "~/.birdframe"
timeout = 45

# --- Only if your WHOLE site is behind basic-auth ---------------------------
# The Belkins BirdNET default leaves the collage and detection API public, so
# usually leave these out.
# basic_user = "monalisa"
# basic_pass = "..."
